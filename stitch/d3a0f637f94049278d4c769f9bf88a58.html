<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play canvas - Canvas Start Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            retro: {
              bg: '#0f172a',
              panel: '#1e293b',
              accent: '#38bdf8',
              glow: '#0284c7'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 selection:bg-sky-500 selection:text-white font-sans antialiased">
  <div data-surface-id="SURF_PLAY_CANVAS" class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 flex flex-col items-center">
    <!-- Header / Branding chrome (non-actionable) -->
    <div class="w-full flex items-center justify-between border-b border-slate-800/80 pb-5 mb-6">
      <div class="flex items-center space-x-3">
        <div class="h-4 w-4 rounded-sm bg-sky-400 rotate-45"></div>
        <span class="text-xl font-bold tracking-wider text-slate-100 uppercase">Canvas Game</span>
      </div>
      <div class="flex items-center space-x-6 text-sm">
        <div class="flex items-center space-x-2">
          <span class="text-slate-400 font-medium">Route:</span>
          <span class="px-2.5 py-1 rounded bg-slate-800 text-sky-400 font-mono text-xs font-semibold">/play</span>
        </div>
      </div>
    </div>

    <!-- Status & Score Bar -->
    <div class="w-full grid grid-cols-2 gap-4 mb-6">
      <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-4 flex flex-col justify-center">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Game Status</span>
        <div role="status" aria-label="Game message" class="min-h-[1.5rem] text-sm font-medium text-emerald-400 flex items-center"></div>
      </div>
      <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-4 flex flex-col justify-center">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Record</span>
        <div class="flex items-baseline space-x-2">
          <span class="text-sm text-slate-400">High Score:</span>
          <div role="status" aria-label="High score" class="text-lg font-bold text-sky-400 font-mono min-h-[1.5rem] flex items-center"></div>
        </div>
      </div>
    </div>

    <!-- Playfield / Canvas Area -->
    <div class="w-full aspect-[16/9] bg-slate-950 border border-slate-800 rounded-xl relative overflow-hidden flex flex-col items-center justify-center p-8 mb-6 shadow-inner">
      <!-- Grid backdrop styling -->
      <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-30"></div>

      <!-- Playfield Decorative Center Display -->
      <div class="relative z-10 flex flex-col items-center text-center">
        <div class="w-20 h-20 rounded-2xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center mb-4 text-sky-400 shadow-lg shadow-sky-500/10">
          <div class="w-8 h-8 rounded-lg bg-sky-400/20 border border-sky-400 flex items-center justify-center">
            <div class="w-3 h-3 bg-sky-400 rounded-sm"></div>
          </div>
        </div>
        <p class="text-slate-400 text-sm max-w-sm">Ready to begin your session. Press Start to initiate the game canvas.</p>
      </div>
    </div>

    <!-- Control Area -->
    <div class="w-full flex items-center justify-center pt-2">
      <button type="button" data-action="ACT_START_GAME" data-control-slot="CSLOT_START_GAME_START_BUTTON" class="px-8 py-3.5 bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950 font-bold rounded-xl shadow-lg shadow-sky-500/20 hover:shadow-sky-400/30 transition-all duration-150 transform active:scale-95 text-base tracking-wide flex items-center justify-center cursor-pointer">
        Start
      </button>
    </div>
  </div>
</body>
</html>
